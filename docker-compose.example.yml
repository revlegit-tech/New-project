services:
  web:
    build: .
    command: python -m uvicorn mlb_app.asgi:app --host 0.0.0.0 --port 8765
    env_file:
      - .env.production.example
    ports:
      - "8765:8765"
    depends_on:
      - postgres

  worker:
    build: .
    command: python daily_ml_workflow.py status
    env_file:
      - .env.production.example
    depends_on:
      - postgres

  scheduler:
    build: .
    command: python scripts/actionnetwork_live_snapshot_workflow.py --date today
    env_file:
      - .env.production.example
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mlb_app
      POSTGRES_USER: mlb_app
      POSTGRES_PASSWORD: replace-with-secure-password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
