name: Daily health check

on:
  workflow_dispatch:
    inputs:
      health_date:
        description: "Date to check, YYYY-MM-DD. Leave blank for latest/yesterday behavior."
        required: false
        default: ""

  schedule:
    # GitHub cron is UTC. 11:00 UTC is 7 AM ET during daylight time.
    - cron: "0 11 * * *"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

      - name: Determine health date
        id: health_date
        shell: bash
        run: |
          INPUT_DATE="${{ github.event.inputs.health_date }}"

          if [ -n "$INPUT_DATE" ]; then
            HEALTH_DATE="$INPUT_DATE"
          else
            HEALTH_DATE=$(TZ=America/New_York date -d "yesterday" +"%Y-%m-%d")
          fi

          echo "health_date=$HEALTH_DATE" >> "$GITHUB_OUTPUT"
          echo "Health date: $HEALTH_DATE"

      - name: Run smoke tests
        run: |
          python -m py_compile playerboard.py mlb_app/server.py tools/phase23_daily_refresh_qa.py
          python -m pytest tests/test_api_contracts.py tests/test_modular_router.py tests/test_wsgi_smoke.py tests/test_asgi_migration.py tests/test_static_file_guard.py tests/test_cache_store.py tests/test_security_export.py tests/test_trust_surface_static_safety.py tests/test_request_observability.py

      - name: Build health summary
        shell: bash
        run: |
          HEALTH_DATE="${{ steps.health_date.outputs.health_date }}"
          SEASON="${HEALTH_DATE:0:4}"

          mkdir -p data/health
          python tools/phase23_daily_refresh_qa.py --date "$HEALTH_DATE" --season "$SEASON" --write | tee "data/health/latest_daily_health.json"

      - name: Package health summary artifact
        if: always()
        shell: bash
        run: |
          mkdir -p workflow-artifacts
          if [ -d data/health ]; then
            tar -czf "workflow-artifacts/daily-health-${{ github.run_id }}.tgz" data/health
          else
            echo "No health outputs found."
          fi

      - name: Upload health summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-health-${{ github.run_id }}
          path: workflow-artifacts/*.tgz
          if-no-files-found: ignore
          retention-days: 14
