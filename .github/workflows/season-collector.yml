name: Baseball data collector

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: "Run type"
        required: true
        default: "manual"
        type: choice
        options:
          - manual
          - morning
          - midday
          - midnight
      include_savant:
        description: "Include Savant/pybaseball sync"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      execute_full_collection:
        description: "Run the full season_auto_collector path. Scheduled runs always use safe daily mode."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  schedule:
    # GitHub cron uses UTC.
    # During US Eastern daylight time:
    # 06:00 ET = 10:00 UTC
    # 12:00 ET = 16:00 UTC
    # 00:00 ET = 04:00 UTC
    - cron: "0 10 * * *"
    - cron: "0 16 * * *"
    - cron: "0 4 * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PHASE18_MARKETS: "pitcher_strikeouts,batter_hits,batter_total_bases,batter_home_runs,batter_rbis,batter_stolen_bases,batter_walks,batter_singles,batter_doubles,batter_runs,batter_2plus_hits,batter_2plus_home_runs,batter_2plus_rbis,batter_3plus_rbis,pitcher_outs,pitcher_hits_allowed,pitcher_earned_runs"
  PLAYERBOARD_BUILD_WORKERS: "1"
  PLAYERBOARD_DAILY_BUILD_LIMIT: "1000"
  PLAYERBOARD_DAILY_SOURCE_MODE: "propline"
  PYTHONUNBUFFERED: "1"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ml.lock.txt

      - name: Determine run mode
        id: mode
        shell: bash
        run: |
          RUN_TYPE="${{ github.event.inputs.run_type }}"
          INCLUDE_SAVANT="${{ github.event.inputs.include_savant }}"
          EXECUTE_FULL="${{ github.event.inputs.execute_full_collection }}"

          if [ -z "$RUN_TYPE" ]; then
            HOUR_ET=$(TZ=America/New_York date +"%H")

            if [ "$HOUR_ET" = "06" ]; then
              RUN_TYPE="morning"
              INCLUDE_SAVANT="false"
            elif [ "$HOUR_ET" = "12" ]; then
              RUN_TYPE="midday"
              INCLUDE_SAVANT="false"
            elif [ "$HOUR_ET" = "00" ]; then
              RUN_TYPE="midnight"
              INCLUDE_SAVANT="true"
            else
              RUN_TYPE="manual"
              INCLUDE_SAVANT="false"
            fi
          fi

          if [ -z "$EXECUTE_FULL" ]; then
            EXECUTE_FULL="false"
          fi

          if [ "$RUN_TYPE" = "midnight" ]; then
            RUN_DATE=$(TZ=America/New_York date -d "yesterday" +"%Y-%m-%d")
          else
            RUN_DATE=$(TZ=America/New_York date +"%Y-%m-%d")
          fi

          echo "run_type=$RUN_TYPE" >> "$GITHUB_OUTPUT"
          echo "include_savant=$INCLUDE_SAVANT" >> "$GITHUB_OUTPUT"
          echo "execute_full=$EXECUTE_FULL" >> "$GITHUB_OUTPUT"
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"

      - name: Run collector
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        shell: bash
        run: |
          set -o pipefail

          RUN_TYPE="${{ steps.mode.outputs.run_type }}"
          INCLUDE_SAVANT="${{ steps.mode.outputs.include_savant }}"
          EXECUTE_FULL="${{ steps.mode.outputs.execute_full }}"
          RUN_DATE="${{ steps.mode.outputs.run_date }}"

          mkdir -p data/status data/health workflow-artifacts

          if [ "${{ github.event_name }}" = "schedule" ] || [ "$EXECUTE_FULL" != "true" ]; then
            echo "Running bounded safe daily workflow for $RUN_DATE ($RUN_TYPE)."
            set +e
            timeout 20m python daily_ml_workflow.py --date "$RUN_DATE" run-daily | tee "workflow-artifacts/collector-run.log"
            COLLECTOR_EXIT=${PIPESTATUS[0]}
            set -e

            if [ "$COLLECTOR_EXIT" -ne 0 ]; then
              echo "::warning::Safe daily collector exited $COLLECTOR_EXIT; continuing degraded so logs/artifacts can be inspected."
              echo "collector_exit=$COLLECTOR_EXIT" > "workflow-artifacts/collector-status.env"
              echo "collector_mode=degraded" >> "workflow-artifacts/collector-status.env"
            else
              echo "collector_exit=0" > "workflow-artifacts/collector-status.env"
              echo "collector_mode=ok" >> "workflow-artifacts/collector-status.env"
            fi
          else
            CMD=(python season_auto_collector.py snapshot --run-type "$RUN_TYPE" --date "$RUN_DATE")
            if [ "$INCLUDE_SAVANT" = "true" ]; then
              CMD+=(--include-savant)
            fi
            echo "${CMD[@]}"
            timeout 35m "${CMD[@]}" | tee "workflow-artifacts/collector-run.log"
          fi

      - name: Run current-day OddsPapi team props
        if: ${{ steps.mode.outputs.execute_full == 'true' && github.event_name != 'schedule' }}
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        shell: bash
        run: |
          if [ -z "$ODDSPAPI_KEY" ]; then
            echo "ODDSPAPI_KEY is not configured; skipping OddsPapi team props."
            exit 0
          fi

          TODAY=$(TZ=America/New_York date +"%Y-%m-%d")
          TOMORROW=$(TZ=America/New_York date -d "$TODAY + 1 day" +"%Y-%m-%d")

          echo "Pulling OddsPapi team props for $TODAY to $TOMORROW"
          timeout 10m python oddspapi_team_backfill.py --from-date "$TODAY" --to-date "$TOMORROW" --max-fixtures 20 || {
            echo "OddsPapi team prop pull failed; continuing collector."
            exit 0
          }

          echo "Flattening current-day OddsPapi game markets"
          timeout 10m python oddspapi_current_game_markets_latest.py --from-date "$TODAY" --to-date "$TOMORROW" || {
            echo "OddsPapi game market flattening failed; continuing collector."
          }

          SEASON=$(python -c "from mlb_app.config import settings; print(settings.current_season)")
          echo "Rebuilding current-day team/game Playerboard markets from OddsPapi for season $SEASON"
          for MARKET in moneyline run_line game_total_runs first_five_total_runs first_inning_total_runs team_total_runs team_first_to_score; do
            python playerboard.py --season "$SEASON" --date "$TODAY" --market "$MARKET" --limit 5000 || true
          done

      - name: Package collector data artifact
        if: always()
        shell: bash
        run: |
          mkdir -p workflow-artifacts
          mkdir -p data/odds data/warehouse/odds_snapshots data/warehouse/raw data/warehouse/summaries data/warehouse/logs data/health/collector_manifests data/edge_board
          python tools/validate_backup_files.py --root .
          python tools/validate_generated_artifacts.py --root . || true
          tar -czf "workflow-artifacts/season-collector-${{ github.run_id }}.tgz" \
            data/cloud \
            data/cache/savant \
            data/cache/odds_movement \
            data/health \
            data/edge_board \
            data/playerboard \
            data/backtests \
            data/audit \
            data/ml \
            data/training \
            data/odds \
            data/warehouse/odds_snapshots \
            data/warehouse/raw \
            data/warehouse/summaries \
            data/warehouse/logs \
            2>/dev/null || true

      - name: Upload compact data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: season-collector-${{ github.run_id }}
          path: workflow-artifacts/*.tgz
          if-no-files-found: ignore
          retention-days: 90
