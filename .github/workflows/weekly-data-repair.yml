name: Weekly data repair

on:
  workflow_dispatch:
    inputs:
      repair_date:
        description: "Repair through this date, YYYY-MM-DD. Leave blank for yesterday."
        required: false
        default: ""
      include_savant:
        description: "Include heavier Savant/BvP sync. Use true only when needed."
        required: false
        default: "false"
      execute:
        description: "Actually execute repair work. Scheduled runs stay dry-run."
        required: false
        default: "false"

  schedule:
    # GitHub cron is UTC.
    # Sunday 09:00 UTC = early Sunday morning ET.
    # This is intentionally separate from fast daily grading.
    - cron: "0 9 * * 0"

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUNBUFFERED: "1"

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ml.lock.txt

      - name: Determine repair date
        id: repair_date
        shell: bash
        run: |
          INPUT_DATE="${{ github.event.inputs.repair_date }}"

          if [ -n "$INPUT_DATE" ]; then
            REPAIR_DATE="$INPUT_DATE"
          else
            REPAIR_DATE=$(TZ=America/New_York date -d "yesterday" +"%Y-%m-%d")
          fi

          echo "repair_date=$REPAIR_DATE" >> "$GITHUB_OUTPUT"
          echo "Repair date: $REPAIR_DATE"

      - name: Compile check
        run: |
          python -m py_compile playerboard.py playerboard_backtest.py model_audit.py ml_export.py season_auto_collector.py

      - name: Run safe weekly repair contract
        shell: bash
        run: |
          REPAIR_DATE="${{ steps.repair_date.outputs.repair_date }}"
          EXECUTE="${{ github.event.inputs.execute }}"

          mkdir -p data/health workflow-artifacts
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$EXECUTE" != "true" ]; then
            python scripts/scheduled_weekly_repair.py --date "$REPAIR_DATE" | tee "workflow-artifacts/weekly-repair.log"
          else
            python scripts/scheduled_weekly_repair.py --date "$REPAIR_DATE" --execute | tee "workflow-artifacts/weekly-repair.log"
          fi

      - name: Validate source-tree safety
        run: |
          python tools/validate_backup_files.py --root .
          python tools/validate_generated_artifacts.py --root . || true

      - name: Run smoke tests after repair
        if: ${{ github.event.inputs.execute == 'true' }}
        run: |
          python -m unittest discover -s tests -p "test_smoke.py" -v

      - name: Keep repair summary current
        if: always()
        shell: bash
        run: |
          REPAIR_DATE="${{ steps.repair_date.outputs.repair_date }}"
          set +e
          python scripts/scheduled_weekly_repair.py --date "$REPAIR_DATE" | tee -a "workflow-artifacts/weekly-repair.log"
          SUMMARY_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$SUMMARY_EXIT" -ne 0 ]; then
            echo "::warning::Weekly repair summary refresh exited $SUMMARY_EXIT; preserving earlier workflow result and uploaded logs."
          fi

      - name: Package repair outputs artifact
        if: always()
        shell: bash
        run: |
          mkdir -p workflow-artifacts
          tar -czf "workflow-artifacts/weekly-repair-${{ github.run_id }}.tgz" \
            data/backtests data/ml data/audit data/cloud data/warehouse data/health \
            data/cache/incremental_stats data/cache/season_stats data/cache/weather \
            data/cache/savant data/cache/odds_movement data/playerboard \
            2>/dev/null || true

      - name: Upload repair outputs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-repair-${{ github.run_id }}
          path: workflow-artifacts/*.tgz
          if-no-files-found: ignore
          retention-days: 14
