repos:
  - repo: local
    hooks:
      - id: security-preflight
        name: Block tracked secret-bearing files
        entry: python tools/security_preflight.py
        language: system
        pass_filenames: false
      - id: pytest-contracts
        name: Run API/data contract tests
        entry: python -m pytest tests/test_api_contracts.py tests/test_data_contracts.py
        language: system
        pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: ["--fix", "mlb_app", "tools", "tests"]
      - id: ruff-format
        args: ["mlb_app", "tools", "tests"]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(\.secrets\.baseline|package-lock\.json)$
