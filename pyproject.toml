[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --ignore=tests/test_image_data_importer.py --ignore=tests/test_prop_analyzer.py --ignore=tests/test_smoke.py"

[tool.coverage.run]
branch = true
source = ["mlb_app", "tools"]
omit = [
  "*/__pycache__/*",
  "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0
exclude_also = [
  "if __name__ == .__main__.",
  "raise SystemExit",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["mlb_app", "tools", "tests"]
exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  "__pycache__",
  "data",
  "dist",
  "node_modules",
]

[tool.ruff.lint]
# CI lint is intentionally high-signal for now. The repo has legacy style debt
# from earlier phases, so broad modernization/import/style rules should be
# cleaned up in a dedicated lint-only pass rather than blocking product fixes.
select = ["E", "F", "B"]
ignore = [
  "E501",
  "E402",
  "E701",
  "E702",
  "F401",
  "F402",
  "F811",
  "F841",
  "B904",
  "B905",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = false
warn_redundant_casts = true
warn_unreachable = false
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
ignore_errors = true
exclude = [
  "app.py",
  "data/",
  "tests/",
]

[[tool.mypy.overrides]]
module = ["tools.*"]
disallow_untyped_defs = false
